services:
  securityDB:
    container_name: securityDB
    image: postgres
    environment:
      POSTGRES_USER: vengeang
      POSTGRES_PASSWORD: password
      PGDATA: /data/postgres
      TZ: Asia/Phnom_Penh
    hostname: postgres
    volumes:
      - postgres:/data/postgres
    ports:
      - "5432:5432"
    networks:
      - postgres
  pgadmin:
    container_name: pgadmin-securityDB
    image: dpage/pgadmin4
    environment:
      PGADMIN_DEFAULT_EMAIL: oengvengeang@gmail.com
      PGADMIN_DEFAULT_PASSWORD: password
      PGADMIN_CONFIG_SERVER_MODE: 'False'
    volumes:
      - pgadmin:/var/lib/pgadmin
    ports:
      - "5050:80"
    networks:
      - postgres
volumes:
  postgres:
  pgadmin:
networks:
  postgres:
    driver: bridge